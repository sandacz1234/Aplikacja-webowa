name: Deploy flashcards to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically the first time this workflow deploys.
          enablement: true

      - name: Build website
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          mkdir -p dist
          cp index.html style.css app.js .nojekyll dist/
          # Publish the public site even before the owner finishes Supabase setup.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e 'process.stdout.write(`window.FLASHCARDS_CONFIG = ${JSON.stringify({supabaseUrl: process.env.SUPABASE_URL, supabaseAnonKey: process.env.SUPABASE_ANON_KEY})};\n`)' > dist/config.js
          else
            printf "window.FLASHCARDS_CONFIG = { supabaseUrl: '', supabaseAnonKey: '' };\n" > dist/config.js
            echo "::warning::The public website is deployed, but account login requires the owner to set SUPABASE_URL and SUPABASE_ANON_KEY."
          fi
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
